name: build-windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ion-sfu v1.11.0
        uses: actions/checkout@v4
        with:
          repository: pion/ion-sfu
          ref: v1.11.0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: Build Windows exe (json-rpc)
        run: GOOS=windows GOARCH=amd64 go build -o ion-sfu-jsonrpc.exe ./cmd/signal/json-rpc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ion-sfu-jsonrpc-windows
          path: ion-sfu-jsonrpc.exe
